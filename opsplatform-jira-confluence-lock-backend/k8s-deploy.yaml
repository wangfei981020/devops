---
apiVersion: v1
kind: Namespace
metadata:
  name: jira-confluence-lock
---
# DB Secret
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: jira-confluence-lock
type: Opaque
stringData:
  MYSQL_USER: "lock_user"
  MYSQL_PASSWORD: "Lock@2026#Secure"
---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsplatform-jira-confluence-lock-backend
  namespace: jira-confluence-lock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opsplatform-jira-confluence-lock-backend
  template:
    metadata:
      labels:
        app: opsplatform-jira-confluence-lock-backend
    spec:
      containers:
        - name: backend
          image: localhost:8070/opsplatform/opsplatform-jira-confluence-lock-backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: ":8080"
            - name: DEV_MODE
              value: "false"
            - name: MYSQL_HOST
              value: "mysql-sso.sso.svc.cluster.local"
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              value: "confluence_locker"
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_PASSWORD
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: opsplatform-jira-confluence-lock-backend
  namespace: jira-confluence-lock
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: opsplatform-jira-confluence-lock-backend
---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsplatform-jira-confluence-lock-frontend
  namespace: jira-confluence-lock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opsplatform-jira-confluence-lock-frontend
  template:
    metadata:
      labels:
        app: opsplatform-jira-confluence-lock-frontend
    spec:
      containers:
        - name: frontend
          image: localhost:8070/opsplatform/opsplatform-jira-confluence-lock-frontend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: opsplatform-jira-confluence-lock-frontend
  namespace: jira-confluence-lock
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30830
  selector:
    app: opsplatform-jira-confluence-lock-frontend
