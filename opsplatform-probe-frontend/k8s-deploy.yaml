apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-frontend
  namespace: probe-ops
  labels:
    app: probe-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe-frontend
  template:
    metadata:
      labels:
        app: probe-frontend
    spec:
      containers:
        - name: probe-frontend
          image: marks26/opsplatform-probe-frontend:v5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "128Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: probe-frontend
  namespace: probe-ops
spec:
  type: NodePort
  selector:
    app: probe-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30827
