---
# PVC for Permission Center MySQL data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pc-pvc
  namespace: sso
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# Secret for Permission Center MySQL credentials
apiVersion: v1
kind: Secret
metadata:
  name: mysql-pc-secret
  namespace: sso
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "PcRoot@2026"
  MYSQL_DATABASE: "permission_center"
  MYSQL_USER: "pc_user"
  MYSQL_PASSWORD: "Pc@2026#Secure"

---
# Permission Center MySQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-pc
  namespace: sso
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-pc
  template:
    metadata:
      labels:
        app: mysql-pc
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: mysql-pc-secret
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mysql-storage
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pc-pvc

---
# Permission Center MySQL Service (ClusterIP - internal only)
apiVersion: v1
kind: Service
metadata:
  name: mysql-pc
  namespace: sso
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: mysql-pc
