version: '3.4'
services:
  opsplatform-confluence-backend:
    image: opsplatform-confluence-backend:v1
    container_name: confluence-center-backend
    environment:
      - PORT=:8080
      - DEV_MODE=true
      - MYSQL_HOST=mysql-confluence
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
      - MYSQL_DATABASE=confluence_center
    ports:
      - "8082:8080"
    restart: unless-stopped
    networks:
      - confluence-net

  frontend:
    image: opsplatform-confluence-frontend:v1
    container_name: confluence-center-frontend
    ports:
      - "8083:80"
    depends_on:
      - opsplatform-confluence-backend
    restart: unless-stopped
    networks:
      - confluence-net

networks:
  confluence-net:
    name: confluence_network-bridge
    external: true
