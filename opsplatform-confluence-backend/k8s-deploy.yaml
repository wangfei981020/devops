---
apiVersion: v1
kind: Namespace
metadata:
  name: confluence-ops
---
# DB Secret
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: confluence-ops
type: Opaque
stringData:
  MYSQL_USER: "confluence_user"
  MYSQL_PASSWORD: "Confluence@2026#Secure"
---
# JWT Secret
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: confluence-ops
type: Opaque
stringData:
  JWT_SECRET: "opsplatform-confluence-jwt-secret-min-32-chars!!"
---
# Portal Secret
apiVersion: v1
kind: Secret
metadata:
  name: portal-secret
  namespace: confluence-ops
type: Opaque
stringData:
  PORTAL_API_URL: "http://opsplatform-backend.opsplatform.svc.cluster.local:8080"
---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsplatform-confluence-backend
  namespace: confluence-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opsplatform-confluence-backend
  template:
    metadata:
      labels:
        app: opsplatform-confluence-backend
    spec:
      hostAliases:
        - ip: "172.17.0.1"
          hostnames:
            - "host.docker.internal"
      containers:
        - name: backend
          image: localhost:8070/opsplatform/confluence-backend:v26
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: ":8080"
            - name: DEV_MODE
              value: "false"
            - name: MYSQL_HOST
              value: "mysql-sso.sso.svc.cluster.local"
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              value: "confluence_center"
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
            - name: PORTAL_API_URL
              valueFrom:
                secretKeyRef:
                  name: portal-secret
                  key: PORTAL_API_URL
            - name: SESSION_TIMEOUT
              value: "180"
            - name: COOKIE_SECURE
              value: "false"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: opsplatform-confluence-backend
  namespace: confluence-ops
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: opsplatform-confluence-backend
---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsplatform-confluence-frontend
  namespace: confluence-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opsplatform-confluence-frontend
  template:
    metadata:
      labels:
        app: opsplatform-confluence-frontend
    spec:
      containers:
        - name: frontend
          image: localhost:8070/opsplatform/confluence-frontend:v40
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: opsplatform-confluence-frontend
  namespace: confluence-ops
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30821
  selector:
    app: opsplatform-confluence-frontend
