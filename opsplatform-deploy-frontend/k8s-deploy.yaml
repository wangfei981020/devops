apiVersion: v1
kind: ConfigMap
metadata:
  name: opsplatform-deploy-frontend-nginx
  namespace: opsplatform
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location /api/ {
        proxy_pass http://opsplatform-deploy-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
      }

      location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
      }

      gzip on;
      gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
      gzip_min_length 1024;
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsplatform-deploy-frontend
  namespace: opsplatform
spec:
  replicas: 1
  selector:
    matchLabels: { app: opsplatform-deploy-frontend }
  template:
    metadata:
      labels: { app: opsplatform-deploy-frontend }
    spec:
      containers:
        - name: frontend
          image: localhost:8070/opsplatform/opsplatform-deploy-frontend:v128
          imagePullPolicy: Always
          ports:
            - { containerPort: 80 }
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
      volumes:
        - name: nginx-conf
          configMap:
            name: opsplatform-deploy-frontend-nginx
            items:
              - key: default.conf
                path: default.conf
---
apiVersion: v1
kind: Service
metadata:
  name: opsplatform-deploy-frontend
  namespace: opsplatform
spec:
  type: NodePort
  selector: { app: opsplatform-deploy-frontend }
  ports:
    - { port: 80, targetPort: 80, nodePort: 30826 }
