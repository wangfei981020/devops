server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 🔒 浏览器安全头（全站默认下发）
  # X-Frame-Options DENY: 防 clickjacking — 攻击者把这个 SPA iframe 进恶意页诱骗管理员误点 PROD 发布
  add_header X-Frame-Options "DENY" always;
  # X-Content-Type-Options nosniff: 防 MIME sniffing → 防 XSS-via-content-type
  add_header X-Content-Type-Options "nosniff" always;
  # Referrer-Policy: 跨域跳转时不泄露完整 URL（含 path/query 可能含 token / id）
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Permissions-Policy: 关闭不需要的浏览器特性
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # Content-Security-Policy:
  #   default-src 'self'        — 默认只能加载同源资源
  #   script-src 'self'         — JS 只能来自同源（Vue 打包后所有 JS 都自托管）
  #   style-src 'self' 'unsafe-inline' — Element Plus / Vue 单文件组件会注入内联 style，必须放
  #   img-src 'self' data:      — Vue 内联小图标走 data: URL
  #   font-src 'self' data:     — @fontsource 字体走自托管 + 部分 data:
  #   connect-src 'self'        — 只能调本域 API（同 nginx 转发到 deploy-backend）
  #   frame-ancestors 'none'    — 跟 X-Frame-Options DENY 双保险
  #   base-uri 'self' / form-action 'self' — 防 base href 注入和表单劫持
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://opsplatform-deploy-backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;
  }

  location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|gif|ico)$ {
    expires 7d;
    add_header Cache-Control "public, immutable" always;
    # 静态资源也下发安全头（add_header 在 location 块中会覆盖外层，重复声明）
    add_header X-Content-Type-Options "nosniff" always;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1024;
}
