basePath: /api
definitions:
  handlers.BatchPresignRequest:
    properties:
      paths:
        example:
        - uploads/a.png
        - uploads/b.png
        items:
          type: string
        type: array
    type: object
  handlers.BatchPresignResponse:
    properties:
      urls:
        type: object
    type: object
  handlers.CreateRowRequest:
    properties:
      attachments:
        items:
          $ref: '#/definitions/handlers.FileAttachment'
        type: array
      data:
        $ref: '#/definitions/handlers.MaintenanceRecordData'
    type: object
  handlers.CreateRowResponse:
    properties:
      id:
        example: 269bb917-fcce-44f2-b689-725894111e80
        type: string
      message:
        example: 数据添加成功
        type: string
      success:
        example: true
        type: boolean
    type: object
  handlers.DomainResponseItem:
    properties:
      can_try_it:
        type: boolean
      code:
        type: string
      description:
        type: string
      name:
        type: string
      sort_order:
        type: integer
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        example: 请求参数无效
        type: string
    type: object
  handlers.FileAttachment:
    properties:
      name:
        example: 通知开始截图.png
        type: string
      path:
        example: uploads/xxx.png
        type: string
    type: object
  handlers.GetCustomTableResponse:
    properties:
      column_config:
        type: object
      columns:
        items:
          type: object
        type: array
      rows:
        items:
          type: object
        type: array
      table:
        type: object
    type: object
  handlers.HierarchyResponse:
    properties:
      gameTypes:
        example:
        - 百家乐
        - 龙虎
        - 轮盘
        items:
          type: string
        type: array
      projects:
        example:
        - 利升
        items:
          type: string
        type: array
      sites:
        example:
        - PT
        - 欧洲厅
        - 卡卡湾
        items:
          type: string
        type: array
      tables:
        example:
        - P001
        - P002
        - E001
        items:
          type: string
        type: array
    type: object
  handlers.MaintenanceRecordData:
    properties:
      affect_settlement:
        enum:
        - 是
        - 否
        example: 否
        type: string
      affected_projects:
        example:
        - 利升
        - 未接入
        items:
          type: string
        type: array
      affected_round_ids:
        type: string
      affected_sites:
        items:
          type: string
        type: array
      affected_tables:
        example:
        - P001
        - P002
        items:
          type: string
        type: array
      close_duration:
        enum:
        - 两分钟内
        - 五分钟内
        - 十分钟内
        - 十分钟以上
        example: 五分钟内
        type: string
      date:
        example: "2026-05-28"
        type: string
      end_time:
        example: 2026-05-28 18:15
        type: string
      game_types:
        items:
          type: string
        type: array
      inspector:
        example: 李四
        type: string
      maintenance_type:
        enum:
        - 紧急维护
        - 临时维护
        - 例行维护
        - 无
        example: 紧急维护
        type: string
      notify_end_screenshot:
        items:
          $ref: '#/definitions/handlers.FileAttachment'
        type: array
      notify_start_screenshot:
        items:
          $ref: '#/definitions/handlers.FileAttachment'
        type: array
      operation:
        enum:
        - 维护
        - 取消
        - 重算
        - 重派彩
        - 包桌T人
        - 漏操作
        - 漏截图
        example: 维护
        type: string
      operator:
        example: 张三
        type: string
      qc_status:
        enum:
        - 正常
        - 异常
        example: 正常
        type: string
      reason:
        example: 系统更新维护
        type: string
      remark:
        example: 已完成，运行正常
        type: string
      start_duration:
        enum:
        - 两分钟内
        - 五分钟内
        - 十分钟内
        - 十分钟以上
        example: 两分钟内
        type: string
      start_time:
        example: 2026-05-28 18:00
        type: string
      table_status:
        type: string
    type: object
  handlers.PatchRowRequest:
    properties:
      attachments:
        items:
          $ref: '#/definitions/handlers.FileAttachment'
        type: array
      data:
        type: object
    type: object
  handlers.PresignedURLResponse:
    properties:
      expires_in:
        example: 3600
        type: integer
      url:
        example: https://minio.../uploads/xxx.png?X-Amz-Signature=...
        type: string
    type: object
  handlers.SuccessResponse:
    properties:
      message:
        example: 操作成功
        type: string
      success:
        example: true
        type: boolean
    type: object
  handlers.UpdateRowRequest:
    properties:
      attachments:
        items:
          $ref: '#/definitions/handlers.FileAttachment'
        type: array
      data:
        $ref: '#/definitions/handlers.MaintenanceRecordData'
    type: object
  handlers.UploadResponse:
    properties:
      path:
        example: uploads/2026/05/xxx.png
        type: string
      url:
        type: string
    type: object
host: localhost:30081
info:
  contact:
    name: 运维平台
  description: |-
    供内部开发对接的 API Key 接口。所有请求需带 X-API-Key 头。
    基础 URL: http://<host>/api
  license:
    name: Internal
  termsOfService: 内部使用
  title: 运维平台 · 内部对接 API
  version: "1.0"
paths:
  /api-docs/domains:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.DomainResponseItem'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 获取当前用户可见的 API 文档业务域
      tags:
      - api_docs
  /api-docs/spec:
    get:
      parameters:
      - description: 业务域 code，如 table_maintenance
        in: query
        name: domain
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: spec 文件不存在（构建时未生成）
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 按业务域返回过滤后的 OpenAPI spec
      tags:
      - api_docs
  /custom-tables/{id}:
    get:
      description: 返回表元信息、列定义、所有行数据。响应里每行带 source_api_key_id 字段（标识是哪个 API Key 创建的）。
      parameters:
      - description: table_id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.GetCustomTableResponse'
        "403":
          description: API Key 缺少 read 权限
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: 获取桌台维护记录列表
      tags:
      - table_maintenance
  /custom-tables/{id}/rows:
    post:
      consumes:
      - application/json
      description: 通过 API Key 创建一条新的维护记录。截图字段需先调 /storage/upload 拿到 path 再放入 data
        中。
      parameters:
      - description: table_id (固定值：09ccbe4d-fcce-44f2-b689-725894111e80)
        in: path
        name: id
        required: true
        type: string
      - description: 记录内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateRowRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CreateRowResponse'
        "400":
          description: 请求参数无效
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: API Key 缺少 create 权限
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: 创建桌台维护记录
      tags:
      - table_maintenance
  /custom-tables/{id}/rows/{rowId}:
    delete:
      parameters:
      - description: table_id
        in: path
        name: id
        required: true
        type: string
      - description: 记录ID
        in: path
        name: rowId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SuccessResponse'
        "403":
          description: API Key 缺少 delete 权限或行属于其他 API Key
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: 删除记录
      tags:
      - table_maintenance
    patch:
      consumes:
      - application/json
      description: PATCH 会浅合并 data 字段：未传的子字段保留原值，传了的子字段覆盖。**推荐二次编辑用这个**。
      parameters:
      - description: table_id
        in: path
        name: id
        required: true
        type: string
      - description: 记录ID
        in: path
        name: rowId
        required: true
        type: string
      - description: 需要更新的字段（只传要改的）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.PatchRowRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: 部分更新记录（PATCH）
      tags:
      - table_maintenance
    put:
      consumes:
      - application/json
      description: PUT 会整体替换 data 字段：未传的子字段会被覆盖为空。如果需要保留原值，请用 PATCH。
      parameters:
      - description: table_id
        in: path
        name: id
        required: true
        type: string
      - description: 记录ID
        in: path
        name: rowId
        required: true
        type: string
      - description: 完整记录内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateRowRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SuccessResponse'
        "400":
          description: 请求参数无效
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: API Key 缺少 update 权限或行属于其他 API Key
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: 全量更新记录（PUT）
      tags:
      - table_maintenance
  /hierarchy:
    get:
      description: 返回平台配置的合法 projects/sites/tables/gameTypes，用于客户端字段校验。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HierarchyResponse'
      security:
      - ApiKeyAuth: []
      summary: 获取桌台层级配置
      tags:
      - table_maintenance
  /storage/presign:
    get:
      description: 传 path query 参数，返回可临时直接访问该文件的 URL。
      parameters:
      - description: 文件 path（来自上传响应）
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PresignedURLResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: 获取预签名 URL（单个）
      tags:
      - table_maintenance
  /storage/presign/batch:
    post:
      consumes:
      - application/json
      description: 一次请求获取多个文件的预签名 URL，减少网络往返。
      parameters:
      - description: 文件 path 列表
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.BatchPresignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.BatchPresignResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: 获取预签名 URL（批量）
      tags:
      - table_maintenance
  /storage/upload:
    post:
      consumes:
      - multipart/form-data
      description: multipart/form-data 上传文件，返回 path。把 path 放入记录的截图字段（如 notify_start_screenshot）。
      parameters:
      - description: 要上传的文件（图片）
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UploadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: API Key 缺少 upload 权限
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: 上传文件
      tags:
      - table_maintenance
schemes:
- http
- https
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
