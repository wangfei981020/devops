<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - 访问受限</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* 动态背景效果 */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(239, 68, 68, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(239, 68, 68, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(234, 179, 8, 0.05) 0%, transparent 40%);
            animation: bgMove 20s ease-in-out infinite;
        }

        @keyframes bgMove {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-5%, 5%) rotate(5deg); }
            50% { transform: translate(5%, -5%) rotate(-5deg); }
            75% { transform: translate(-3%, -3%) rotate(3deg); }
        }

        /* 网格背景 */
        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 1;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 40px;
            max-width: 600px;
        }

        /* 403 错误码 */
        .error-code {
            font-size: 180px;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 50%, #b91c1c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 80px rgba(239, 68, 68, 0.5);
            position: relative;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .error-code::after {
            content: '403';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 50%, #b91c1c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: blur(30px);
            opacity: 0.5;
            z-index: -1;
        }

        /* 禁止图标 */
        .icon-wrapper {
            margin: 30px 0;
            position: relative;
        }

        .ban-icon {
            width: 120px;
            height: 120px;
            position: relative;
            margin: 0 auto;
        }

        .ban-icon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #ef4444;
            stroke-width: 2;
            filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.5));
        }

        .globe {
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 标题和描述 */
        .title {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 16px;
            color: #f1f5f9;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .description {
            font-size: 15px;
            color: #64748b;
            line-height: 1.8;
            margin-bottom: 40px;
        }

        /* 警告框 */
        .warning-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 20px 24px;
            margin: 30px 0;
            display: flex;
            align-items: center;
            gap: 16px;
            text-align: left;
        }

        .warning-icon {
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            background: rgba(239, 68, 68, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .warning-icon svg {
            width: 24px;
            height: 24px;
            fill: #ef4444;
        }

        .warning-text {
            flex: 1;
        }

        .warning-title {
            font-size: 16px;
            font-weight: 500;
            color: #fca5a5;
            margin-bottom: 4px;
        }

        .warning-desc {
            font-size: 14px;
            color: #94a3b8;
        }

        /* 信息卡片 */
        .info-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin: 30px 0;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: left;
            transition: all 0.3s ease;
        }

        .info-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .info-label {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .info-value {
            font-size: 14px;
            color: #e2e8f0;
            font-family: 'Courier New', monospace;
        }

        /* 按钮 */
        .btn-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 40px;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: #fff;
            border: none;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(59, 130, 246, 0.5);
        }

        .btn-secondary {
            background: transparent;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* 底部信息 */
        .footer {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
        }

        .footer-text {
            font-size: 13px;
            color: #475569;
        }

        .footer-link {
            color: #64748b;
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-link:hover {
            color: #94a3b8;
        }

        /* 扫描线效果 */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(239, 68, 68, 0.03) 50%,
                transparent 100%
            );
            animation: scan 8s linear infinite;
            pointer-events: none;
            z-index: 5;
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .error-code {
                font-size: 120px;
            }

            .title {
                font-size: 22px;
            }

            .subtitle {
                font-size: 16px;
            }

            .info-cards {
                grid-template-columns: 1fr;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .warning-box {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="grid-bg"></div>
    <div class="scanline"></div>

    <div class="container">
        <div class="error-code">403</div>
        
        <div class="icon-wrapper">
            <div class="ban-icon">
                <svg viewBox="0 0 100 100">
                    <!-- 地球 -->
                    <circle class="globe" cx="50" cy="50" r="35" stroke-dasharray="5,3"/>
                    <ellipse class="globe" cx="50" cy="50" rx="35" ry="15" stroke-dasharray="5,3"/>
                    <line x1="50" y1="15" x2="50" y2="85"/>
                    <!-- 禁止符号 -->
                    <circle cx="50" cy="50" r="42" stroke-width="4" stroke="#ef4444"/>
                    <line x1="20" y1="20" x2="80" y2="80" stroke-width="4" stroke="#ef4444"/>
                </svg>
            </div>
        </div>

        <h1 class="title">访问受限</h1>
        <p class="subtitle">您所在的国家或地区无法访问此页面</p>
        <p class="description">
            根据相关法律法规和政策要求，该服务在您当前所在的地理位置不可用。<br>
            如有疑问，请联系网站管理员。
        </p>

        <div class="warning-box">
            <div class="warning-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
            </div>
            <div class="warning-text">
                <div class="warning-title">地理位置限制</div>
                <div class="warning-desc">系统检测到您的访问来源位于受限制的地区，访问请求已被拒绝。</div>
            </div>
        </div>

        <div class="info-cards">
            <div class="info-card">
                <div class="info-label">错误代码</div>
                <div class="info-value">403 Forbidden</div>
            </div>
            <div class="info-card">
                <div class="info-label">请求时间</div>
                <div class="info-value" id="request-time">--</div>
            </div>
            <div class="info-card">
                <div class="info-label">您的 IP 地址</div>
                <div class="info-value" id="client-ip">检测中...</div>
            </div>
            <div class="info-card">
                <div class="info-label">请求 ID</div>
                <div class="info-value" id="request-id">--</div>
            </div>
        </div>

        <div class="btn-group">
            <a href="javascript:history.back()" class="btn btn-secondary">
                <svg viewBox="0 0 24 24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
                返回上一页
            </a>
            <a href="/" class="btn btn-primary">
                <svg viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                返回首页
            </a>
        </div>
    </div>

    <div class="footer">
        <p class="footer-text">
            如需帮助，请联系 <a href="mailto:support@example.com" class="footer-link">support@example.com</a>
        </p>
    </div>

    <script>
        // 显示当前时间
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            document.getElementById('request-time').textContent = timeStr;
        }
        updateTime();
        setInterval(updateTime, 1000);

        // 生成随机请求ID
        function generateRequestId() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 16; i++) {
                if (i > 0 && i % 4 === 0) result += '-';
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }
        document.getElementById('request-id').textContent = generateRequestId();

        // 尝试获取客户端IP（实际环境中由后端提供）
        // 这里使用占位符，实际部署时可以由后端注入
        const clientIp = '<!--CLIENT_IP-->' || '***.***.***.**';
        if (clientIp.includes('CLIENT_IP')) {
            // 如果是模板占位符，显示隐藏的IP
            document.getElementById('client-ip').textContent = '***.***.***.**';
        } else {
            document.getElementById('client-ip').textContent = clientIp;
        }
    </script>
</body>
</html>
