apiVersion: v1
kind: ConfigMap
metadata:
  name: opsplatform-frontend-config
  namespace: opsplatform-prod
data:
  # 生产 API 域名（若前端采用运行时注入可使用）
  API_BASE_URL: "https://api.opsplatform.example.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsplatform-frontend-vue
  namespace: opsplatform-prod
  labels:
    app: opsplatform-frontend-vue
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: opsplatform-frontend-vue
  template:
    metadata:
      labels:
        app: opsplatform-frontend-vue
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: frontend
          image: marks26/opsplatform-frontend-vue:v274
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: opsplatform-frontend-vue
  namespace: opsplatform-prod
  labels:
    app: opsplatform-frontend-vue
spec:
  type: ClusterIP
  selector:
    app: opsplatform-frontend-vue
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opsplatform-frontend-ingress
  namespace: opsplatform-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - opsplatform.example.com
      secretName: opsplatform-web-tls
  rules:
    - host: opsplatform.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opsplatform-frontend-vue
                port:
                  number: 80
