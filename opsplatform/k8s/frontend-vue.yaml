apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsplatform-frontend-vue
  namespace: opsplatform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opsplatform-frontend-vue
  template:
    metadata:
      labels:
        app: opsplatform-frontend-vue
    spec:
      containers:
      - name: frontend
        image: localhost:8070/opsplatform/frontend-vue:v547
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: opsplatform-frontend-vue
  namespace: opsplatform
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30081
  selector:
    app: opsplatform-frontend-vue
