apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsplatform-frontend
  namespace: opsplatform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opsplatform-frontend
  template:
    metadata:
      labels:
        app: opsplatform-frontend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: frontend
        image: ghcr.io/wangfei981020/opsplatform-frontend:v4
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: opsplatform-frontend
  namespace: opsplatform
spec:
  type: NodePort
  selector:
    app: opsplatform-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080

