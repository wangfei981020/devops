# GitHub Container Registry 拉取密钥
# 使用前请替换 YOUR_GITHUB_TOKEN 为你的 GitHub Personal Access Token
#
# 生成 base64 编码的认证信息:
# PowerShell:
#   $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("wangfei981020:YOUR_GITHUB_TOKEN"))
#   $dockerconfig = '{"auths":{"ghcr.io":{"auth":"' + $auth + '"}}}'
#   [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($dockerconfig))
#
# 或者使用 kubectl 创建:
#   kubectl create secret docker-registry ghcr-secret \
#     --docker-server=ghcr.io \
#     --docker-username=wangfei981020 \
#     --docker-password=YOUR_GITHUB_TOKEN \
#     -n opsplatform

apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: opsplatform
type: kubernetes.io/dockerconfigjson
data:
  # 需要替换为实际的 base64 编码值
  .dockerconfigjson: <BASE64_ENCODED_DOCKER_CONFIG>


