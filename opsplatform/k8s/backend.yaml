apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: opsplatform
data:
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  MYSQL_USER: "root"
  MYSQL_DATABASE: "opsplatform"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsplatform-backend
  namespace: opsplatform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opsplatform-backend
  template:
    metadata:
      labels:
        app: opsplatform-backend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: backend
        image: localhost:8070/library/opsplatform-backend:v12
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 8088
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: mysql-secret
        env:
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_ROOT_PASSWORD
        - name: PORT
          value: "8080"
        - name: METRICS_PORT
          value: "8088"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8088
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8088
          initialDelaySeconds: 10
          periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: opsplatform-backend
  namespace: opsplatform
  labels:
    app: opsplatform-backend
spec:
  selector:
    app: opsplatform-backend
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: metrics
    port: 8088
    targetPort: 8088

