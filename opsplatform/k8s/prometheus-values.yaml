# Prometheus Helm Values
# 使用 kube-prometheus-stack，包含 Prometheus、Grafana

# Grafana 配置
grafana:
  enabled: true
  adminPassword: admin123
  service:
    type: NodePort
    nodePort: 30030

# Prometheus 配置
prometheus:
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    # 额外的 scrape 配置（监控 Windows 主机，可选）
    additionalScrapeConfigs:
      - job_name: 'windows'
        static_configs:
          - targets: ['host.docker.internal:9182']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: 'windows-host'

# Alertmanager 配置 - 已禁用
alertmanager:
  enabled: false

# kubeStateMetrics - 提供 K8s 集群指标（Pod状态、Deployment等）
kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: false  # Docker Desktop 不支持，需要单独安装 windows_exporter

# 资源限制
prometheusOperator:
  resources:
    limits:
      cpu: 200m
      memory: 200Mi
    requests:
      cpu: 100m
      memory: 100Mi
