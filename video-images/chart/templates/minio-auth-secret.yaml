# 只保留两对最小权限凭证(无 root):
#  - writer: 生成端上传(RW 仅本桶)
#  - reader: 服务代理只读(RO 仅本桶)
# 用户/桶/策略由 devops-minio 侧的 provisioning Job(持 root)创建;本应用零 root。
# ⚠️ 口令要与 devops-minio values 里对应 tenant 的 writer/reader 口令一致。
apiVersion: v1
kind: Secret
metadata:
  name: video-images-minio-writer
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  access-key: {{ .Values.minio.writerUser | quote }}
  secret-key: {{ .Values.minio.writerPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: video-images-minio-reader
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  access-key: {{ .Values.minio.readerUser | quote }}
  secret-key: {{ .Values.minio.readerPassword | quote }}
