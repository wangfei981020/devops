apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: video-images-generator
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app: video-images-generator
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: video-images-web
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app: video-images-web
