# 示例文件 — 真实 Secret 用命令创建：
#   kubectl -n opsplatform create secret generic gke-version-exporter-mysql \
#     --from-literal=dsn='root:123456@tcp(mysql-deploy.opsplatform:3306)/gke_version_monitor?parseTime=true&charset=utf8mb4'
#
# 注：GCP Service Account key 不再用 K8s Secret，改成在前端 UI 上添加集群时粘贴 SA JSON，
# 存到 MySQL clusters.sa_key_json 字段，按集群粒度独立管理。
apiVersion: v1
kind: Secret
metadata:
  name: gke-version-exporter-mysql
  namespace: opsplatform
type: Opaque
stringData:
  dsn: "root:123456@tcp(mysql-deploy.opsplatform:3306)/gke_version_monitor?parseTime=true&charset=utf8mb4"
