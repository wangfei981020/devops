# gke-version-exporter-secret — 示例模板
#
# ⚠️ 不要直接 kubectl apply 这个文件到生产！
# 推荐：
#   1. 用 kubectl create secret generic gke-version-exporter-secret --from-literal=... （见下方）
#   2. 或用 External Secrets / Sealed Secrets 等托管方案
#   3. 应用此示例仅限本地开发
#
# 与发布系统 (opsplatform-deploy-secret) 保持同一套环境变量风格：
#   MYSQL_HOST / MYSQL_PORT / MYSQL_USER / MYSQL_PASSWORD / MYSQL_DATABASE
# 后端通过 envFrom: secretRef 注入。

apiVersion: v1
kind: Secret
metadata:
  name: gke-version-exporter-secret
  namespace: opsplatform
type: Opaque
stringData:
  # ========== MySQL 连接 ==========
  MYSQL_HOST: "mysql.opsplatform"
  MYSQL_PORT: "3306"
  MYSQL_USER: "root"
  MYSQL_PASSWORD: "<PASSWORD>"
  MYSQL_DATABASE: "gke_version_monitor"

  # ========== Lark 告警里"查看详情"按钮跳转地址 ==========
  # 留空走默认 http://localhost:30827；GKE 上建议填前端对外访问地址
  FRONTEND_BASE_URL: ""
