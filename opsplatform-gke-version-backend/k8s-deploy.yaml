apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsplatform-gke-version-backend
  namespace: opsplatform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opsplatform-gke-version-backend
  template:
    metadata:
      labels:
        app: opsplatform-gke-version-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8088"
    spec:
      containers:
      - name: backend
        image: localhost:8070/opsplatform/opsplatform-gke-version-backend:v10
        imagePullPolicy: Always
        ports:
        - { name: http,    containerPort: 8080 }
        - { name: metrics, containerPort: 8088 }
        envFrom:
        - secretRef:
            name: gke-version-exporter-secret
        livenessProbe:
          httpGet: { path: /health, port: metrics }
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet: { path: /ready, port: metrics }
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: opsplatform-gke-version-backend
  namespace: opsplatform
  labels:
    app: opsplatform-gke-version-backend
spec:
  selector:
    app: opsplatform-gke-version-backend
  ports:
  - { name: http, port: 8080, targetPort: http }
