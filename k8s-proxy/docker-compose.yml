# k8s-port-proxy: 把 Mac host 端口转发到 Docker Desktop K8s 节点
# Docker Desktop K8s NodePort 不直接 expose 到 localhost，需要这层 nginx
#
# 加新端口：nginx.conf 加 server 块 + 下面 ports 加映射 + README.md 端口表补一行
#          → docker compose up -d
# 端口清单必须跟集群里 `kubectl get svc -A | grep NodePort` 的结果保持一致
services:
  k8s-port-proxy:
    image: nginx:alpine
    container_name: k8s-port-proxy
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - kind   # 必须接到 Docker Desktop K8s 所在的 kind 网络，才能访问节点 IP
    ports:
      # http
      - "30081:30081"   # opsplatform 主平台前端（API 走 /api/）
      - "30091:30091"   # MinIO Console
      - "30300:30300"   # Gitea
      - "30319:30319"   # video-images 内网画廊看板
      - "30826:30826"   # 发布控制台前端（API 走 /api/）
      - "30829:30829"   # CMDB 前端（API 走 /api/）
      - "30830:30830"   # 运维 AI 助手前端（API 走 /api/）
      - "30825:30825"   # ES 告警平台前端（API 走 /api）
      - "30840:30840"   # video-images web
      - "30900:30900"   # SSO 后端
      - "30901:30901"   # SSO 前端
      # tcp stream
      - "30306:30306"   # opsplatform MySQL 本地调试直连

networks:
  kind:
    external: true
