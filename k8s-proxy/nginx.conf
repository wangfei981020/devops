
# k8s-port-proxy：把 Docker Desktop K8s 节点的 NodePort 转发到 Mac host
#
# ⚠️ 下面的 172.18.0.5 是 K8s 节点在 kind 网络里的 IP，节点重建后会变，
#    变了跑 ./fix-cluster-ip.sh 自动改。
# ⚠️ 端口清单必须跟集群里实际的 NodePort 一致，见 README.md 的端口表。
#    加/删服务时：改这里 + 改 docker-compose.yml 的 ports + docker compose up -d
worker_processes 1;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;

    # opsplatform 主平台前端（/api/ 由前端 nginx 反代到 opsplatform-backend:8080）
    server {
        listen 30081;
        client_max_body_size 100m;
        location / {
            proxy_pass http://172.18.0.5:30081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
        }
    }

    # MinIO Console
    server {
        listen 30091;
        location / {
            proxy_pass http://172.18.0.5:30091;
            proxy_set_header Host $host;
        }
    }

    # Gitea
    server {
        listen 30300;
        client_max_body_size 500m;
        location / {
            proxy_pass http://172.18.0.5:30300;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
        }
    }

    # video-images 内网画廊看板
    server {
        listen 30319;
        location / {
            proxy_pass http://172.18.0.5:30319;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
        }
    }

    # 发布控制台前端
    server {
        listen 30826;
        client_max_body_size 100m;
        location / {
            proxy_pass http://172.18.0.5:30826;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
        }
    }

    # CMDB 前端
    server {
        listen 30829;
        client_max_body_size 100m;
        location / {
            proxy_pass http://172.18.0.5:30829;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
        }
    }

    # 运维 AI 助手前端
    server {
        listen 30830;
        client_max_body_size 100m;
        location / {
            proxy_pass http://172.18.0.5:30830;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
        }
    }

    # ES 告警平台前端（/api 由前端 nginx 反代到 alert-backend:8080）
    server {
        listen 30825;
        client_max_body_size 20m;
        location / {
            proxy_pass http://172.18.0.5:30825;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
        }
    }

    # video-images 视频缩略图 web
    server {
        listen 30840;
        location / {
            proxy_pass http://172.18.0.5:30840;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
        }
    }

    # SSO 后端
    server {
        listen 30900;
        client_max_body_size 10m;
        location / {
            proxy_pass http://172.18.0.5:30900;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
        }
    }

    # SSO 前端
    server {
        listen 30901;
        location / {
            proxy_pass http://172.18.0.5:30901;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
        }
    }
}

stream {
    # opsplatform MySQL 本地调试直连（Service: opsplatform/mysql-nodeport）
    server { listen 30306; proxy_pass 172.18.0.5:30306; }
}
