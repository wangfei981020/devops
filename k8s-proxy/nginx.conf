worker_processes 1;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;

    server {
        listen 30081;
        client_max_body_size 100m;
        location / {
            proxy_pass http://172.22.0.2:30081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
        }
    }

    server {
        listen 30091;
        location / {
            proxy_pass http://172.22.0.2:30091;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 30900;
        client_max_body_size 10m;
        location / {
            proxy_pass http://172.22.0.2:30900;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
        }
    }

    server {
        listen 30901;
        location / {
            proxy_pass http://172.22.0.2:30901;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
        }
    }
}

stream {
    server { listen 30082; proxy_pass 172.22.0.2:30082; }
    server { listen 30083; proxy_pass 172.22.0.2:30083; }
    server { listen 30084; proxy_pass 172.22.0.2:30084; }
    server { listen 30085; proxy_pass 172.22.0.2:30085; }
    server { listen 30086; proxy_pass 172.22.0.2:30086; }
    server { listen 30087; proxy_pass 172.22.0.2:30087; }
    server { listen 30088; proxy_pass 172.22.0.2:30088; }
    server { listen 30089; proxy_pass 172.22.0.2:30089; }
    server { listen 30090; proxy_pass 172.22.0.2:30090; }
    server { listen 30825; proxy_pass 172.22.0.2:30825; }
    server { listen 30826; proxy_pass 172.22.0.2:30826; }
}
