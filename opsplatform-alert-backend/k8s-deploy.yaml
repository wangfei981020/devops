apiVersion: v1
kind: Namespace
metadata:
  name: alert-ops

---
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: alert-ops
type: Opaque
stringData:
  MYSQL_USER: "alert_user"
  MYSQL_PASSWORD: "Alert@2026#Secure"
  MYSQL_DATABASE: "alert_center"

---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: alert-ops
type: Opaque
stringData:
  JWT_SECRET: "AlertPlatform@2026#JWTSecretKey!!"

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: alert-ops
type: Opaque
stringData:
  REDIS_PASSWORD: "5aoQVFr03eWnF6ioK8YahMhg3FOJNQJN"

---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-backend
  namespace: alert-ops
  labels:
    app: alert-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-backend
  template:
    metadata:
      labels:
        app: alert-backend
    spec:
      containers:
        - name: alert-backend
          image: localhost:8070/opsplatform/alert-backend:v108
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8088
              name: health
          env:
            - name: PORT
              value: ":8080"
            - name: HEALTH_PORT
              value: ":8088"
            - name: TZ
              value: "Asia/Shanghai"
            - name: MYSQL_HOST
              value: "mysql.opsplatform.svc.cluster.local"
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_DATABASE
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
            - name: REDIS_HOST
              value: "redis.opsplatform.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            - name: REDIS_DB
              value: "3"
            - name: SESSION_TIMEOUT
              value: "180"
            - name: PORTAL_API_URL
              value: "http://opsplatform-backend.opsplatform.svc.cluster.local:8080"
            - name: COOKIE_SECURE
              value: "false"
            - name: COOKIE_SAMESITE
              value: "lax"
            - name: CORS_ALLOWED_ORIGIN
              value: "*"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: alert-backend
  namespace: alert-ops
spec:
  selector:
    app: alert-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: health
      port: 8088
      targetPort: 8088

---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-frontend
  namespace: alert-ops
  labels:
    app: alert-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-frontend
  template:
    metadata:
      labels:
        app: alert-frontend
    spec:
      containers:
        - name: alert-frontend
          image: localhost:8070/opsplatform/alert-frontend:v87
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: alert-frontend
  namespace: alert-ops
spec:
  type: NodePort
  selector:
    app: alert-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30825

---
# Prometheus ServiceMonitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alert-backend
  namespace: alert-ops
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: alert-backend
  endpoints:
    - port: health
      path: /metrics
      interval: 30s
