server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API to backend
    location /api/ {
        proxy_pass http://sso-backend.sso.svc.cluster.local:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy OIDC endpoints to backend
    location /.well-known/ {
        proxy_pass http://sso-backend.sso.svc.cluster.local:9000;
    }

    location /authorize {
        proxy_pass http://sso-backend.sso.svc.cluster.local:9000;
    }

    location /token {
        proxy_pass http://sso-backend.sso.svc.cluster.local:9000;
    }

    location /userinfo {
        proxy_pass http://sso-backend.sso.svc.cluster.local:9000;
    }

    location /jwks {
        proxy_pass http://sso-backend.sso.svc.cluster.local:9000;
    }

    location /sso/ {
        proxy_pass http://sso-backend.sso.svc.cluster.local:9000;
    }

    # Storage proxy (MinIO logos)
    location /storage/ {
        proxy_pass http://sso-backend.sso.svc.cluster.local:9000;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
