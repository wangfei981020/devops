apiVersion: v1
kind: ConfigMap
metadata:
  name: opsplatform-cmdb-frontend-nginx
  namespace: opsplatform
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      # ── 安全响应头 ──────────────────────────────────────────
      # CMDB 里存着云账号凭据、kubeconfig、DNS 写权限，而它经 Cloudflare
      # 暴露在公网。原先一个安全头都没有。
      #
      # ⚠️ nginx 坑：某个 location 里只要写了 add_header，**server 级的头会全部失效**
      # （不是合并，是替换）。下面 /assets/ 和 /index.html 各有自己的 Cache-Control，
      # 所以这几行必须在那两处重复一遍，否则恰恰是页面本身没有头。
      add_header X-Frame-Options "DENY" always;                    # 防点击劫持：不许被套进 iframe
      add_header X-Content-Type-Options "nosniff" always;          # 别按内容猜 MIME
      add_header Referrer-Policy "same-origin" always;             # 别把内网路径带去第三方
      add_header Strict-Transport-Security "max-age=31536000" always;
      # CSP：前端零外链（已核实 dist 里没有 CDN/字体外链），可以收紧到 self。
      # style 必须留 unsafe-inline——Element Plus 大量用内联样式，去掉会整站掉版。
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

      # ^~ = 前缀命中就别再看正则了。本地目前没有正则 location 所以踩不到，
      # 但生产那份因为有静态资源正则，/api/xxx.js 会被劫持成 404。两边写法保持一致。
      location ^~ /api/ {
        proxy_pass http://opsplatform-cmdb-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
      }
      # 带 hash 的静态资源可长期缓存；index.html 不缓存，避免发版后看到旧界面
      location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # ↓ 这五行是 server 级那份的副本，一个都不能少。
        #   本 location 写了 add_header，server 级的就整体不继承了。
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
      }
      location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        # 同上——而且这一处最要紧：真正被套 iframe 的是页面本身，不是 js 文件
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
      }
      location / { try_files $uri $uri/ /index.html; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsplatform-cmdb-frontend
  namespace: opsplatform
spec:
  replicas: 1
  selector:
    matchLabels: { app: opsplatform-cmdb-frontend }
  template:
    metadata:
      labels: { app: opsplatform-cmdb-frontend }
    spec:
      containers:
        - name: frontend
          image: localhost:8070/opsplatform/opsplatform-cmdb-frontend:v207
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: nginx-conf
          configMap: { name: opsplatform-cmdb-frontend-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: opsplatform-cmdb-frontend
  namespace: opsplatform
spec:
  type: NodePort
  selector: { app: opsplatform-cmdb-frontend }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30829
