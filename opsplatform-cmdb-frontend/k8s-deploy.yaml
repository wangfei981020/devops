apiVersion: v1
kind: ConfigMap
metadata:
  name: opsplatform-cmdb-frontend-nginx
  namespace: opsplatform
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      location /api/ {
        proxy_pass http://opsplatform-cmdb-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
      }
      location / { try_files $uri $uri/ /index.html; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsplatform-cmdb-frontend
  namespace: opsplatform
spec:
  replicas: 1
  selector:
    matchLabels: { app: opsplatform-cmdb-frontend }
  template:
    metadata:
      labels: { app: opsplatform-cmdb-frontend }
    spec:
      containers:
        - name: frontend
          image: localhost:8070/opsplatform/opsplatform-cmdb-frontend:v23
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: nginx-conf
          configMap: { name: opsplatform-cmdb-frontend-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: opsplatform-cmdb-frontend
  namespace: opsplatform
spec:
  type: NodePort
  selector: { app: opsplatform-cmdb-frontend }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30829
