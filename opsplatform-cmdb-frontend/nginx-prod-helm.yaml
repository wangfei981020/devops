# 生产（Helm）用的 nginx ConfigMap —— **整段可直接粘贴进生产 chart**。
#
# ⚠️ 仓库里有两份 nginx 配置，管的不是同一个环境，别改错：
#   nginx.conf / k8s-deploy.yaml 的 ConfigMap → 本地 docker-desktop
#   本文件                                     → 生产 Helm chart
# 生产 chart 不在这个仓库里，改本文件**不会自动生效**，必须手工同步过去。
#
# 相对生产原配置修了五处，逐条实测过（见块内注释）：
#   1. /api/ 改成 ^~，否则 /api/xxx.js 被静态正则劫持 → 404
#   2. index.html 显式禁缓存，否则发版后用户还看旧界面
#   3. /health 用 default_type，原来 add_header 会产生两个 Content-Type
#   4. 静态资源去掉 expires（它自带 Cache-Control，会和 add_header 叠成两条）
#   5. 补五个安全响应头，且在每个带 add_header 的 location 里重复

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx-config
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      gzip on;
      gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
      gzip_min_length 1000;
      gzip_vary on;          # 过 CDN 必须按编码区分缓存

      # 安全响应头。CMDB 存着云账号凭据/kubeconfig/DNS 写权限，且公网可达。
      # ⚠️ nginx 坑：某个 location 里只要写了 add_header，server 级的头就整体不继承
      #    （是替换不是合并）。所以下面每个带 add_header 的 location 都要重复一遍。
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "same-origin" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

      # ⚠️ 必须是 ^~ 而不是裸的 /api/。nginx 的匹配顺序是「正则优先于前缀」，
      #    下面那条静态资源正则会把 /api/xxx.js、/api/xxx.svg 抢走当静态文件找 → 404，
      #    表现得像"这个接口不存在"。^~ = 前缀命中就别再看正则了。
      location ^~ /api/ {
        proxy_pass http://opsplatform-cmdb-backend:8080;   # 后端 service 名:8080
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 集群同步/GKE 发现可能超 60s；超时返回 504 而后端仍在跑，
        # 用户看到失败但动作已经发生了。给足余量。
        proxy_read_timeout 180s;
      }

      # ⚠️ index.html 必须显式禁缓存。原本只有 Last-Modified/ETag，
      #    浏览器和 CDN 会按启发式缓存它，发版后用户仍拿旧的 index.html
      #    引用旧 hash 的 js —— "明明发了新版界面怎么没变"。
      location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
      }

      location / { try_files $uri $uri/ /index.html; }

      # 静态资源缓存。
      # ⚠️ 别再叠 expires 1y：expires 自己会发一个 Cache-Control，
      #    加上下面这条就变成两个 Cache-Control（同样是 add_header 追加的毛病）。
      #    合成一条写清楚即可。
      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
      }

      # ⚠️ 用 default_type，不要用 add_header Content-Type。
      #    add_header 是追加：return 200 自带一个 Content-Type，
      #    结果会出现两个（octet-stream + json），有些客户端/CDN 取第一个，
      #    把健康检查当成文件下载。
      location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
      }
    }
