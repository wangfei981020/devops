# 生产（Helm）用的 nginx 配置。
#
# ⚠️ 仓库里有两份 nginx 配置，管的不是同一个环境，别改错：
#   nginx.conf / k8s-deploy.yaml 的 ConfigMap  → **本地 docker-desktop**
#   本文件                                      → **生产**，内容要贴进生产 Helm chart 的
#                                                 `{{ .Release.Name }}-nginx-config` ConfigMap
#
# 生产 chart 不在这个仓库里，所以改完本文件**不会自动生效**，必须手工同步过去。
#
# 2026-08-04 相对生产原配置修了四处，逐条都实测过（见文件内注释）：
#   1. /api/ 改成 ^~，否则 /api/xxx.js 这类请求被静态正则劫持 → 404
#   2. /health 用 default_type，原来的 add_header 会产生两个 Content-Type
#   3. index.html 显式禁缓存，否则发版后用户还看旧界面
#   4. 补五个安全响应头（原本一个都没有），且在每个带 add_header 的 location 里重复

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
  gzip_min_length 1000;
  # 经 CDN 时必须声明按编码区分缓存，否则可能把 gzip 版本发给不支持的客户端
  gzip_vary on;

  # ── 安全响应头 ────────────────────────────────────────────────
  # CMDB 存着云账号凭据、kubeconfig、DNS 写权限，且经 Cloudflare 暴露在公网。
  #
  # ⚠️ nginx 坑：某个 location 里只要写了 add_header，**server 级的头整体不继承**
  #    （是替换不是合并）。下面几个带 add_header 的 location 必须各自重复一遍。
  add_header X-Frame-Options "DENY" always;                 # 防点击劫持
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;           # 别把内网路径带去第三方
  add_header Strict-Transport-Security "max-age=31536000" always;
  # 前端零外链（dist 里没有 CDN/字体外链）才能收到 self。
  # style 必须留 unsafe-inline——Element Plus 大量用内联样式，去掉整站掉版。
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # ⚠️ 必须是 ^~ 而不是裸的 /api/。
  #    nginx 的匹配顺序是「正则 location 优先于前缀 location」，
  #    下面那条静态资源正则会把 /api/xxx.js、/api/xxx.svg 这类请求抢走，
  #    当成静态文件去磁盘上找 → 404，而且看起来像"这个接口不存在"。
  #    ^~ 的含义是"前缀命中就别再看正则了"。
  location ^~ /api/ {
    proxy_pass http://opsplatform-cmdb-backend:8080;   # 后端 service 名:8080
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 集群同步 / GKE 发现这类操作可能超过 60s，超时会返回 504 而后端仍在跑，
    # 用户看到的是失败、实际动作已经发生。给足余量。
    proxy_read_timeout 180s;
  }

  # 带 hash 的静态资源可以长期缓存
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # ↓ server 级安全头的副本，一条都不能少（见上面的 nginx 坑）
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  }

  # ⚠️ index.html 必须显式禁缓存。
  #    它原本只有 Last-Modified/ETag，浏览器和 CDN 会按启发式缓存它，
  #    发版后用户仍拿到旧的 index.html，引用的还是旧 hash 的 js →
  #    "我明明发了新版，界面怎么没变"。这一条是 SPA 发版的必备项。
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    # 同上：这里也得重复安全头，而且这一处最要紧——
    # 真正会被套进 iframe 的是页面本身，不是 js 文件
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  }

  location / { try_files $uri $uri/ /index.html; }

  # ⚠️ 用 default_type 而不是 add_header Content-Type。
  #    add_header 是**追加**：配 return 200 时响应里会出现两个 Content-Type
  #    （application/octet-stream + application/json），
  #    有些客户端/CDN 取第一个，会把健康检查当成文件下载。
  location = /health {
    default_type application/json;
    return 200 '{"status":"ok"}';
  }
}
