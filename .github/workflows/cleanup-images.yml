name: Cleanup old container images

on:
  schedule:
    - cron: '0 0 * * 0'  # 每周日凌晨执行
  workflow_dispatch:  # 支持手动触发

jobs:
  cleanup-backend:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old untagged backend images
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'opsplatform-backend'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: true

  cleanup-frontend:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old untagged frontend images
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'opsplatform-frontend'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: true

