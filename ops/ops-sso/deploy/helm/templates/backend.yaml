{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sso.backend.fullname" . }}
  labels:
    {{- include "sso.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "sso.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sso.backend.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 60
      {{- include "sso.antiAffinity" (list . (include "sso.backend.selectorLabels" .)) | nindent 6 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "sso.image" (dict "ctx" . "img" .Values.backend.image) | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
            - name: metrics
              containerPort: {{ .Values.backend.service.metricsPort }}
          {{- with .Values.backend.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # ⚠️ 多副本下这三件事必须成立，否则副本越多问题越多：
          #  1. 定时采集任务要选主（leases 表已就绪），不然 N 个副本重复采集
          #  2. 数据库迁移要加锁，多副本同时启动会抢跑
          #  3. license 状态要定期从 DB 热加载，不能只在启动时读，
          #     否则激活后要重启全部副本才生效
          # 详见 docs/plans/opsplane-rewrite-plan.md §6
          # ⚠️ 健康端点在 **metrics 端口（8088）**，不是业务端口。
          # 这是后端有意的设计：业务端口 hang 死时探活仍然可用，
          # 不至于把"卡住"表现成"进程没了"。探针打错端口的表现是
          # 一直 404 → CrashLoop，而应用其实完全正常。
          startupProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 3
            failureThreshold: 40      # 迁移可能跑很久，给足时间
          readinessProbe:
            httpGet: { path: /ready, port: metrics }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sso.backend.fullname" . }}
  labels:
    {{- include "sso.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      name: http
    - port: {{ .Values.backend.service.metricsPort }}
      targetPort: metrics
      name: metrics
  selector:
    {{- include "sso.backend.selectorLabels" . | nindent 4 }}
{{- /*
PDB 判据要看**实际会有几个副本**：开了 HPA 时 replicaCount 只在
第一次创建时生效，之后由 minReplicas 决定。只看 replicaCount 会出现
"跑着多副本却一个 PDB 都没有"，而 helm 一切正常、kubectl get pdb 是空的。
*/}}
{{- $asBackend := .Values.backend.autoscaling | default dict }}
{{- $effPdb := ternary (int ($asBackend.minReplicas | default 0)) (int .Values.backend.replicaCount) ($asBackend.enabled | default false) }}
{{- if and .Values.backend.podDisruptionBudget.enabled (gt $effPdb 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "sso.backend.fullname" . }}
  labels:
    {{- include "sso.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  minAvailable: {{ .Values.backend.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "sso.backend.selectorLabels" . | nindent 6 }}
{{- end }}
{{- end }}
