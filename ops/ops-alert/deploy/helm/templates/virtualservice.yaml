{{- include "alert.requireEnv" . }}
{{- if (.Values.istio | default dict).enabled }}
{{- /*
Istio 形态的入口。Service 走 ClusterIP，由 VirtualService 挂到 ingressgateway 上。

# 为什么和 ingress.yaml 并存而不是二选一替换

这是个要卖的产品：多数客户用标准 K8s Ingress，装了 Istio 的用这个。
删掉任何一个都会让一部分客户装不上。

# ⚠️ 两个都开会打架

同一个域名有两条入口时，实际生效的那条取决于集群里哪个控制器先接管，
而两边的超时/重试/请求体上限通常是不一样的 —— 症状是"偶发的行为不一致"，
最难查的那种。所以这里直接拒绝，不留给运行期。

# /api 不单独配路由

由前端 nginx 反代到后端。在网关上再切一刀，会让"前端能通、接口 404"
这类问题多一个排查层，而这一层的配置错误没有任何直接症状。
*/}}
{{- if (.Values.ingress | default dict).enabled }}
{{- fail "istio.enabled 与 ingress.enabled 不能同时为 true：同一个域名两条入口，实际生效哪条取决于哪个控制器先接管，超时与重试策略却不一样。请只留一个。" }}
{{- end }}
{{- if not .Values.istio.gateways }}
{{- fail "istio.enabled=true 但 istio.gateways 为空。VirtualService 不挂网关等于没有入口 —— 对象能创建成功、域名不通、没有任何报错。请填形如 istio-system/xxx-istio-ingressgateway-inner 的网关。" }}
{{- end }}
{{- if not .Values.istio.hosts }}
{{- fail "istio.enabled=true 但 istio.hosts 为空。没有 host 的 VirtualService 匹配不到任何请求，且不会报错。" }}
{{- end }}
{{- /*
⚠️ 重试条件的安全闸。

connect-failure / refused-stream 是安全的：请求**根本没到应用**，重发不会产生第二次副作用。
5xx 不是：它意味着应用收到了、处理了、然后返回 500。

OpsAlert 里有非幂等的真扣费写操作（域名续费）。如果 POST 在**扣费成功之后**才出错返回 500，
网关的重试会再打两次 —— 白送两次重复扣款，而且这一层重试在应用日志里
长得和"用户手点了三次"一模一样，对账时根本分不出来。

应用内的重试已经收得很紧（必须先回查厂商侧到期日、确认没扣费才允许重试）。
在网关上放一个无条件 5xx 重试，等于从外面把那道门绕开了。

真要开的话必须显式声明 allowUnsafeRetryOn —— 让它成为一个有人签字的决定。
*/}}
{{- $retryOn := .Values.istio.retries.retryOn | default "" }}
{{- if and (regexMatch "5xx|retriable-status-codes|gateway-error" $retryOn) (not .Values.istio.retries.allowUnsafeRetryOn) }}
{{- fail (printf "istio.retries.retryOn 含 %q：这类条件会在**应用已经处理过请求之后**重发，对非幂等写（域名续费是真扣费）等于重复扣款。请只用 connect-failure,refused-stream；确有必要请显式设置 istio.retries.allowUnsafeRetryOn=true。" $retryOn) }}
{{- end }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "alert.fullname" . }}
  labels:
    {{- include "alert.labels" . | nindent 4 }}
  {{- with .Values.istio.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gateways:
    {{- range .Values.istio.gateways }}
    - {{ . | quote }}
    {{- end }}
  hosts:
    {{- range (.Values.istio | default dict).hosts }}
    - {{ . | quote }}
    {{- end }}
  http:
    - match:
        {{- range .Values.istio.matchPrefix }}
        - uri:
            prefix: {{ . | quote }}
        {{- end }}
      route:
        - destination:
            # 同 chart 内生成，不需要人填 —— 地址靠手工同步是上一代反复出问题的根源
            host: {{ printf "%s.%s.svc.cluster.local" (include "alert.frontend.fullname" .) .Release.Namespace | quote }}
            port:
              number: {{ .Values.frontend.service.port }}
      {{- with .Values.istio.retries }}
      retries:
        attempts: {{ .attempts }}
        perTryTimeout: {{ .perTryTimeout }}
        retryOn: {{ .retryOn | quote }}
      {{- end }}
      # ⚠️ 必须大于前端 nginx 的 proxyTimeoutSeconds。
      # 反过来的话网关先掐断，用户看到的是网关的 504，
      # 而真正的原因（某个慢查询）在后端日志里，两边对不上。
      timeout: {{ .Values.istio.timeout }}
{{- end }}
