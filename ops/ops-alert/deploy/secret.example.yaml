# OpsAlert 后端的全部敏感配置 —— 一个文件、一个 Secret。
#
# 用法：
#   1. cp secret.example.yaml secret.yaml     ← secret.yaml 不要提交进 git
#   2. 改下面的值（namespace、数据库、密钥）
#   3. kubectl apply -f secret.yaml
#   4. 部署时 values-prod.yaml 里保持
#        backend.secret.create: false
#        backend.secret.existingSecret: ops-alert-backend-secret
#
# 生成随机密钥：
#   JWT_SECRET     openssl rand -hex 32
#   ALERT_AES_KEY  openssl rand -hex 16     ← 必须正好 32 个字符
#
# ⚠️ ALERT_AES_KEY 是数据源凭据的加密钥匙。**换掉之后已存的凭据全部解不开**，
#    表现为所有规则查询突然失败，而配置看着完全没动过。
#    轮换它必须连带重新填一遍所有数据源的凭据。
#
# ⚠️ JWT_SECRET 换掉会让所有在线会话立即失效（所有人被登出）。
#    这是它该有的行为，但别在业务高峰做。
#
# ⚠️ 数据库拆成五个独立的键，**不要**写成一行 DSN：
#    DSN 拼接（连接超时、读写超时、时区、字符集）由后端的 buildDSN 负责，
#    那些参数不该让每个部署的人重新拼一遍 —— 漏掉 readTimeout 的后果是
#    数据库卡住时连接池被占满，每个查库接口一起卡死，对外表现成网关 524。
apiVersion: v1
kind: Secret
metadata:
  name: ops-alert-backend-secret
  namespace: ops-alert          # ← 改成目标 namespace
type: Opaque
stringData:
  # ── 数据库（五个独立变量，后端自己拼 DSN）──
  MYSQL_HOST: "mysql.example.internal"
  MYSQL_PORT: "3306"
  MYSQL_USER: "alert_user"
  MYSQL_PASSWORD: "<改成真实密码>"
  MYSQL_DATABASE: "opsalert"

  # ── 会话 ──
  JWT_SECRET: "<openssl rand -hex 32>"

  # ── 数据源凭据的加密密钥（32 字符）──
  ALERT_AES_KEY: "<openssl rand -hex 16>"

  # ── 首个管理员的初始密码 ──
  # 只在 admin 账号**不存在**时生效；已存在的账号不会被它改回去
  ADMIN_PASSWORD: "<改成强密码>"
