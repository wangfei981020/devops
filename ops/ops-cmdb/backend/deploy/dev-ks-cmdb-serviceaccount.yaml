# DEV KubeSphere(4.x / ks-core)：给 CMDB 建专用 ServiceAccount，签发【永久不过期】的只读 token。
# 2026-07-28 在 DEV 集群实测通过（/api/v1/nodes、/kapis/resources.kubesphere.io/... 均 200）。
#
# 为什么用 ServiceAccount 而不是 User + 密码换 token：
#   - 4.x 的用户 token 有效期由全局 authentication.issuer.accessTokenMaxAge 控制（DEV=168h），
#     没法只给某个账号设永久；改成 0h 会让所有 console 用户会话都不过期，不划算。
#   - SA 的 token 由 controller 用 jwtSecret 直接签发，payload 里 token_type=static_token 且【无 exp】，
#     只影响这一个身份，存在集群 Secret 里，重启/升级都不丢，也不需要定时续期任务。
#
# ⚠️ 授权必须用 kind: User + 完整用户名，不能用 kind: ServiceAccount：
#   KubeSphere 的 SA 身份在 token 里是 "kubesphere:serviceaccount:<ns>:<name>"，
#   而 RBAC 展开 kind: ServiceAccount 时拼的是 K8s 原生的 "system:serviceaccount:<ns>:<name>"，
#   两者前缀对不上 → 绑定形同虚设，表现为权限规则明明够宽却一直 403。踩过这个坑。
#
# 拿 token：
#   kubectl -n kubesphere-system get secret | grep cmdb-readonly     # 找 kubesphere.io/service-account-token 那条
#   kubectl -n kubesphere-system get secret <名字> -o jsonpath='{.data.token}' | base64 -d
# 验证永久：
#   echo "$SATOKEN" | cut -d. -f2 | base64 -d      # payload 里不应出现 exp
apiVersion: kubesphere.io/v1alpha1
kind: ServiceAccount
metadata:
  name: cmdb-readonly
  namespace: kubesphere-system
  annotations:
    kubesphere.io/description: "CMDB 只读接入：拉流水线/构建日志给 AI 诊断，勿用于人工登录"
---
# 平台层：普通用户级别，无任何平台管理权。
apiVersion: iam.kubesphere.io/v1beta1
kind: GlobalRoleBinding
metadata:
  name: cmdb-readonly-sa-platform-regular-user
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: "kubesphere:serviceaccount:kubesphere-system:cmdb-readonly"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: GlobalRole
  name: platform-regular
---
# 集群层：cluster-viewer = 内置的"查看集群中的所有资源"，规则为 */*/(get,list,watch)，纯只读。
# CMDB 的定位本就是集群只读排障，授到这个粒度不算越权。
apiVersion: iam.kubesphere.io/v1beta1
kind: ClusterRoleBinding
metadata:
  name: cmdb-readonly-sa-cluster-viewer-user
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: "kubesphere:serviceaccount:kubesphere-system:cmdb-readonly"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-viewer
