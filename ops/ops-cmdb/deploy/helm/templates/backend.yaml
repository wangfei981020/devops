{{- include "cmdb.requireEnv" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cmdb.backend.fullname" . }}
  labels:
    {{- include "cmdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  # ⚠️ 开了 HPA 就**不能**再写 replicas。
  #
  # 两者都在时，每次 helm upgrade 都会把副本数按回 replicaCount，
  # 把 HPA 扩出来的实例砍掉；HPA 随后再扩回去。
  # 表现是"每次发布之后容量掉一截然后慢慢恢复"，
  # 而发布日志、HPA 事件、Deployment 状态全都正常 —— 没有任何一处会报错。
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  # 只留 3 份历史。默认 10 —— 每次发布留一个 ReplicaSet，
  # 频繁发布会在 etcd 里堆一堆没人看的对象（DEV 集群 1.86 万对象过半是这类垃圾）。
  # 3 份足够回滚：真要回到更早的版本，helm rollback 看的是 release 历史不是 ReplicaSet。
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "cmdb.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cmdb.backend.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 60
      # Pod 级安全上下文：容器级那份的**兜底**。
      #
      # 两处都写不是冗余：容器级 securityContext 是 values 里可被覆盖的，
      # 有人为了排障临时改一版就可能把 runAsNonRoot 丢掉，
      # 而 Pod 级这份留在模板里、覆盖不到，kubelet 仍会拒绝以 root 启动的镜像。
      # 也是 Pod Security Standards "restricted" 要求的形态。
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- include "cmdb.antiAffinity" (list . (include "cmdb.backend.selectorLabels" .)) | nindent 6 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "cmdb.image" (dict "ctx" . "img" .Values.backend.image) | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
            - name: metrics
              containerPort: {{ .Values.backend.service.metricsPort }}
          {{- with .Values.backend.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # ⚠️ 多副本下这三件事必须成立，否则副本越多问题越多：
          #  1. 定时采集任务要选主（leases 表已就绪），不然 N 个副本重复采集
          #  2. 数据库迁移要加锁，多副本同时启动会抢跑
          #  3. license 状态要定期从 DB 热加载，不能只在启动时读，
          #     否则激活后要重启全部副本才生效
          # 详见 docs/plans/opsplane-rewrite-plan.md §6
          # ⚠️ 健康端点在 **metrics 端口（8088）**，不是业务端口。
          # 这是后端有意的设计：业务端口 hang 死时探活仍然可用，
          # 不至于把"卡住"表现成"进程没了"。探针打错端口的表现是
          # 一直 404 → CrashLoop，而应用其实完全正常。
          startupProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 3
            failureThreshold: 40      # 迁移可能跑很久，给足时间
          readinessProbe:
            httpGet: { path: /ready, port: metrics }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "cmdb.securityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cmdb.backend.fullname" . }}
  labels:
    {{- include "cmdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      name: http
    - port: {{ .Values.backend.service.metricsPort }}
      targetPort: metrics
      name: metrics
  selector:
    {{- include "cmdb.backend.selectorLabels" . | nindent 4 }}
{{- /*
PDB 的判据必须看**实际会有几个副本**。

⚠️ 原来只看 replicaCount，而开了 HPA 之后那个值只在第一次创建时生效，
之后副本数由 HPA 的 minReplicas 决定。生产把 replicaCount 设成 1、
minReplicas 设成 2 时，实际跑 2 个副本却**一个 PDB 都不生成** ——
节点排水时两个副本可以被同时驱逐，而 helm 一切正常、kubectl get pdb 是空的，
没有任何地方会提示你少了这层保护。
*/}}
{{- $effBackend := ternary (int .Values.backend.autoscaling.minReplicas) (int .Values.backend.replicaCount) .Values.backend.autoscaling.enabled }}
{{- if and .Values.backend.podDisruptionBudget.enabled (gt $effBackend 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cmdb.backend.fullname" . }}
  labels:
    {{- include "cmdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  minAvailable: {{ .Values.backend.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "cmdb.backend.selectorLabels" . | nindent 6 }}
{{- end }}
{{- if .Values.backend.autoscaling.enabled }}
{{ include "cmdb.hpa" (dict "ctx" . "name" (include "cmdb.backend.fullname" .) "cfg" .Values.backend.autoscaling "component" "backend") }}
{{- end }}
