{{- include "cmdb.requireEnv" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cmdb.frontend.fullname" . }}
  labels:
    {{- include "cmdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  # 只留 3 份历史。默认是 10 —— 每次发布留一个 ReplicaSet，
  # 频繁发布的服务会在 etcd 里堆一堆没人看的对象（DEV 集群 1.86 万对象里过半是这类垃圾）。
  # 3 份足够回滚：真要回到更早的版本，helm rollback 看的是 release 历史不是 ReplicaSet。
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 先起新的再停旧的，滚动期间容量不下降。
      # 静态前端很轻，多一个副本的开销可忽略，不值得为省这点资源冒中断风险。
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "cmdb.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # nginx.conf 变了要触发滚动 —— ConfigMap 更新本身不会重启 Pod，
        # 少了这个校验和，改完配置以为生效了其实没有。
        checksum/config: {{ include (print $.Template.BasePath "/frontend-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cmdb.frontend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # 优雅退出：nginx 收到 SIGTERM 立刻断连接，
      # 先睡 5 秒让 Endpoints 摘除生效，避免滚动更新时零星 502。
      terminationGracePeriodSeconds: 30
      # Pod 级安全上下文：容器级那份的**兜底**。
      #
      # 两处都写不是冗余：容器级 securityContext 是 values 里可被覆盖的，
      # 有人为了排障临时改一版就可能把 runAsNonRoot 丢掉，
      # 而 Pod 级这份留在模板里、覆盖不到，kubelet 仍会拒绝以 root 启动的镜像。
      # 也是 Pod Security Standards "restricted" 要求的形态。
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- include "cmdb.antiAffinity" (list . (include "cmdb.frontend.selectorLabels" .)) | nindent 6 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nginx
          image: {{ include "cmdb.image" (dict "ctx" . "img" .Values.frontend.image) | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          # 三种探针职责不同，参数不能共用一套：
          #   startup   保护慢启动的容器不被 liveness 杀掉
          #   readiness 决定是否接流量，失败就摘出 Endpoints
          #   liveness  只在真死了才重启，阈值必须比 readiness 宽松
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- include "cmdb.securityContext" . | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            # readOnlyRootFilesystem 下 nginx 需要的可写目录必须显式挂出来
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "cmdb.frontend.fullname" . }}-nginx
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cmdb.frontend.fullname" . }}
  labels:
    {{- include "cmdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.frontend.service.type "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
  selector:
    {{- include "cmdb.frontend.selectorLabels" . | nindent 4 }}
{{- /*
PDB 的判据必须看**实际会有几个副本**。

⚠️ 原来只看 replicaCount，而开了 HPA 之后那个值只在第一次创建时生效，
之后副本数由 HPA 的 minReplicas 决定。生产把 replicaCount 设成 1、
minReplicas 设成 2 时，实际跑 2 个副本却**一个 PDB 都不生成** ——
节点排水时两个副本可以被同时驱逐，而 helm 一切正常、kubectl get pdb 是空的，
没有任何地方会提示你少了这层保护。
*/}}
{{- $effFrontend := ternary (int .Values.frontend.autoscaling.minReplicas) (int .Values.frontend.replicaCount) .Values.frontend.autoscaling.enabled }}
{{- if and .Values.frontend.podDisruptionBudget.enabled (gt $effFrontend 1) }}
---
# ⚠️ 只在副本数 > 1 时创建。
# 单副本 + minAvailable:1 会让节点排空永远卡住 —— 驱逐这唯一的 Pod 违反 PDB，
# 不驱逐节点就下不掉。这是集群升级时最常见的卡死。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cmdb.frontend.fullname" . }}
  labels:
    {{- include "cmdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  minAvailable: {{ .Values.frontend.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "cmdb.frontend.selectorLabels" . | nindent 6 }}
{{- end }}
{{- if .Values.frontend.autoscaling.enabled }}
{{ include "cmdb.hpa" (dict "ctx" . "name" (include "cmdb.frontend.fullname" .) "cfg" .Values.frontend.autoscaling "component" "frontend") }}
{{- end }}
