# 复制为 k8s-secret.yaml 并填真实值后 apply（k8s-secret.yaml 不进 git）
apiVersion: v1
kind: Secret
metadata:
  name: opsplatform-cmdb-secret
  namespace: opsplatform
type: Opaque
stringData:
  MYSQL_HOST: "host.docker.internal"
  MYSQL_PORT: "13307"
  MYSQL_USER: "cmdb_user"
  MYSQL_PASSWORD: "REPLACE_ME"
  MYSQL_DATABASE: "cmdb"
  JWT_SECRET: "REPLACE_ME_openssl_rand_base64_48"
  CMDB_AES_KEY: "REPLACE_ME_32+_chars"
  ADMIN_PASSWORD: "REPLACE_ME"
