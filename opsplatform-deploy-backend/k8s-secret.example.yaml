# opsplatform-deploy-secret — 示例模板，仅供首次部署参考
#
# ⚠️ 不要直接 kubectl apply 这个文件到生产！
# 推荐：
#   1. 用 kubectl create secret generic opsplatform-deploy-secret --from-literal=... （见 README）
#   2. 或用 External Secrets / Sealed Secrets 等托管方案
#   3. 应用此示例仅限本地开发
#
# 生产环境 k8s-deploy.yaml 不再包含 Secret 定义，避免 apply 时把真实 Secret 覆盖成占位符。

apiVersion: v1
kind: Secret
metadata:
  name: opsplatform-deploy-secret
  namespace: opsplatform
type: Opaque
stringData:
  # ========== 敏感：生产必须生成/修改 ==========
  # openssl rand -base64 32  ⚠️ 丢失 = DB 里所有加密 token 报废
  AES_KEY: "REPLACE_ME_WITH_openssl_rand_base64_32"
  # openssl rand -base64 48  换了会使所有在线会话失效
  JWT_SECRET: "REPLACE_ME_WITH_openssl_rand_base64_48"
  # 明文 JWT 模式留空；启用 AES 加密跳转时跟运维平台约定同值
  APP_PORTAL_SECRET: ""

  # ========== MySQL 连接 ==========
  MYSQL_HOST: "host.docker.internal"
  MYSQL_PORT: "13307"
  MYSQL_USER: "deploy_user"
  MYSQL_PASSWORD: "123123"
  MYSQL_DATABASE: "deploy_center"

  # ========== 运维平台对接 ==========
  CORS_ORIGIN: "https://ops.your-company.com"
  PORTAL_API_URL: "http://opsplatform-backend.opsplatform.svc.cluster.local:8080"

  # ========== 行为参数 ==========
  SESSION_TIMEOUT: "180"
  COOKIE_SECURE: "true"
  COOKIE_SAMESITE: "strict"
  GIT_CACHE_DIR: "/app/git-cache"

  # ========== 运行环境 ==========
  # APP_ENV=prod（默认）：空密钥/CORS 会拒绝启动
  # APP_ENV=dev：允许使用内置 dev fallback，仅用于本地调试
  APP_ENV: "prod"
