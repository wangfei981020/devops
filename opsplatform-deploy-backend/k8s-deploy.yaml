# Secret 已拆到 k8s-secret.example.yaml，生产单独管理
# apply 此文件不会动 opsplatform-deploy-secret
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opsplatform-deploy-cache
  namespace: opsplatform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsplatform-deploy-backend
  namespace: opsplatform
spec:
  replicas: 1
  strategy:
    type: Recreate  # 单副本，避免 git 锁撞车
  selector:
    matchLabels: { app: opsplatform-deploy-backend }
  template:
    metadata:
      labels: { app: opsplatform-deploy-backend }
    spec:
      containers:
        - name: backend
          image: localhost:8070/opsplatform/opsplatform-deploy-backend:v42
          imagePullPolicy: Always
          ports:
            - { name: http,   containerPort: 8080 }
            - { name: health, containerPort: 8081 }
          envFrom:
            - secretRef:
                name: opsplatform-deploy-secret
          volumeMounts:
            - { name: cache, mountPath: /app/git-cache }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits:   { cpu: "1",  memory: 1Gi }
          livenessProbe:
            httpGet: { path: /health, port: health }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /ready, port: health }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: cache
          persistentVolumeClaim: { claimName: opsplatform-deploy-cache }
---
apiVersion: v1
kind: Service
metadata:
  name: opsplatform-deploy-backend
  namespace: opsplatform
spec:
  selector: { app: opsplatform-deploy-backend }
  ports:
    - { name: http, port: 8080, targetPort: http }
