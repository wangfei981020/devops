# Secret 已拆到 k8s-secret.example.yaml，生产单独管理
# apply 此文件不会动 opsplatform-deploy-secret
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opsplatform-deploy-cache
  namespace: opsplatform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsplatform-deploy-backend
  namespace: opsplatform
spec:
  replicas: 1
  strategy:
    type: Recreate  # 单副本，避免 git 锁撞车
  selector:
    matchLabels: { app: opsplatform-deploy-backend }
  template:
    metadata:
      labels: { app: opsplatform-deploy-backend }
    spec:
      # 升级时给 preStop 留 10 分钟跑完 in-flight 发布任务（preStop 自身轮询 inflight=0 才放行 SIGTERM）
      terminationGracePeriodSeconds: 600
      containers:
        - name: backend
          image: localhost:8070/opsplatform/opsplatform-deploy-backend:v132
          imagePullPolicy: Always
          ports:
            - { name: http,    containerPort: 8080 }
            - { name: metrics, containerPort: 8088 }
          envFrom:
            - secretRef:
                name: opsplatform-deploy-secret
          env:
            # 系统间调用共享 token（运维平台管理页代理调 /api/public/* 用）
            # 必须和 opsplatform backend 的同名 env 一致
            - name: DEPLOY_CENTER_INTERNAL_TOKEN
              value: "opsplatform-deploy-internal-2026-please-rotate"
            # 并发闸：同时进行的 git/helm 重活上限（防 100 并发发布/新增 OOM）。
            # 每个并行的 helm/git 峰值 ~100-200MB；12 * 200MB ≈ 2.4G，配合 4Gi limit 稳。
            # 调大更快但更吃内存/CPU；调小更省但排队更久。改这个值即可，不用改代码。
            - name: DEPLOY_CONCURRENCY
              value: "12"
          volumeMounts:
            - { name: cache, mountPath: /app/git-cache }
          resources:
            # 单副本（架构要求：进程内 git 缓存 + 隔离 checkout + 内存锁）。
            # 100 并发靠"并发闸(DEPLOY_CONCURRENCY) + 隔离浅克隆"扛，不是靠多副本。
            # 实测：100 并发新增模块峰值内存仅 ~250Mi（每 op clone 171ms/helm 37ms，很轻），
            # 瓶颈是同 env 共享 -apps 文件的 push 串行(I/O)，不吃 CPU/内存。
            # 故 request 给足调度基线，limit 留大 headroom（真实大 chart + 并发 poll 更吃内存）。
            requests: { cpu: "1",  memory: 1Gi }
            limits:   { cpu: "4",  memory: 3Gi }
          livenessProbe:
            httpGet: { path: /health, port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /ready, port: metrics }
            initialDelaySeconds: 5
            periodSeconds: 10
          # 滚动升级核心：preStop 先把 pod 切到 drain（readiness=503 → Service 摘 endpoint），
          # 然后轮询 /internal/inflight，等所有异步发布 goroutine 跑完再退出，K8s 才会发 SIGTERM
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    wget -qO- http://127.0.0.1:8088/internal/drain >/dev/null 2>&1 || true
                    # 最多等 540s (9 分钟)，给 SIGTERM 留 60s 兜底
                    for i in $(seq 1 270); do
                      n=$(wget -qO- http://127.0.0.1:8088/internal/inflight 2>/dev/null | grep -o '"count":[0-9]*' | grep -o '[0-9]*')
                      [ -z "$n" ] && n=0
                      [ "$n" = "0" ] && exit 0
                      sleep 2
                    done
      volumes:
        - name: cache
          persistentVolumeClaim: { claimName: opsplatform-deploy-cache }
---
apiVersion: v1
kind: Service
metadata:
  name: opsplatform-deploy-backend
  namespace: opsplatform
spec:
  selector: { app: opsplatform-deploy-backend }
  ports:
    - { name: http, port: 8080, targetPort: http }
