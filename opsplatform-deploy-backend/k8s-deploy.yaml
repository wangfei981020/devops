apiVersion: v1
kind: Secret
metadata:
  name: opsplatform-deploy-secret
  namespace: opsplatform
type: Opaque
stringData:
  # ========== 敏感 ==========
  # AES 加密密钥（openssl rand -base64 32），丢失 = DB 里所有加密 token 解不出
  AES_KEY: "REPLACE_ME_WITH_openssl_rand_base64_32"
  # JWT 签名密钥（openssl rand -base64 48），换了会使所有在线会话失效
  JWT_SECRET: "REPLACE_ME_WITH_openssl_rand_base64_48"
  # 运维平台跳转 token AES 解密 secret；留空走明文 JWT
  APP_PORTAL_SECRET: ""
  # ========== MySQL 连接 ==========
  MYSQL_HOST: "host.docker.internal"
  MYSQL_PORT: "13307"
  MYSQL_USER: "deploy_user"
  MYSQL_PASSWORD: "123123"
  MYSQL_DATABASE: "deploy_center"
  # ========== 非敏感（统一 Secret 管理方便运维） ==========
  CORS_ORIGIN: "*"
  SESSION_TIMEOUT: "180"
  PORTAL_API_URL: "http://opsplatform-backend.opsplatform.svc.cluster.local:8080"
  COOKIE_SECURE: "false"
  COOKIE_SAMESITE: "lax"
  GIT_CACHE_DIR: "/app/git-cache"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opsplatform-deploy-cache
  namespace: opsplatform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsplatform-deploy-backend
  namespace: opsplatform
spec:
  replicas: 1
  strategy:
    type: Recreate  # 单副本，避免 git 锁撞车
  selector:
    matchLabels: { app: opsplatform-deploy-backend }
  template:
    metadata:
      labels: { app: opsplatform-deploy-backend }
    spec:
      containers:
        - name: backend
          image: localhost:8070/opsplatform/opsplatform-deploy-backend:v38
          imagePullPolicy: Always
          ports:
            - { name: http,   containerPort: 8080 }
            - { name: health, containerPort: 8081 }
          envFrom:
            - secretRef:
                name: opsplatform-deploy-secret
          volumeMounts:
            - { name: cache, mountPath: /app/git-cache }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits:   { cpu: "1",  memory: 1Gi }
          livenessProbe:
            httpGet: { path: /health, port: health }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /ready, port: health }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: cache
          persistentVolumeClaim: { claimName: opsplatform-deploy-cache }
---
apiVersion: v1
kind: Service
metadata:
  name: opsplatform-deploy-backend
  namespace: opsplatform
spec:
  selector: { app: opsplatform-deploy-backend }
  ports:
    - { name: http, port: 8080, targetPort: http }
