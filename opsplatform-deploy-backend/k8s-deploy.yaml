apiVersion: v1
kind: Namespace
metadata:
  name: deploy-ops

---
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: deploy-ops
type: Opaque
stringData:
  MYSQL_USER: "deploy_user"
  MYSQL_PASSWORD: "123123"
  MYSQL_DATABASE: "deploy_center"

---
apiVersion: v1
kind: Secret
metadata:
  name: aes-secret
  namespace: deploy-ops
type: Opaque
stringData:
  AES_KEY: "DeployPlatform@2026#AES32ByteKey!!"

---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-backend
  namespace: deploy-ops
  labels:
    app: deploy-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deploy-backend
  template:
    metadata:
      labels:
        app: deploy-backend
    spec:
      containers:
        - name: deploy-backend
          image: opsplatform-deploy-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8088
              name: health
          env:
            - name: PORT
              value: ":8080"
            - name: HEALTH_PORT
              value: ":8088"
            - name: TZ
              value: "Asia/Shanghai"
            - name: MYSQL_HOST
              value: "host.docker.internal"
            - name: MYSQL_PORT
              value: "13307"
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_DATABASE
            - name: AES_KEY
              valueFrom:
                secretKeyRef:
                  name: aes-secret
                  key: AES_KEY
            - name: GIT_WORK_DIR
              value: "/tmp/deploy-git"
            - name: CORS_ALLOWED_ORIGIN
              value: "*"
          volumeMounts:
            - name: git-work
              mountPath: /tmp/deploy-git
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: git-work
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: deploy-backend
  namespace: deploy-ops
spec:
  type: NodePort
  selector:
    app: deploy-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30827
    - name: health
      port: 8088
      targetPort: 8088

---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-frontend
  namespace: deploy-ops
  labels:
    app: deploy-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deploy-frontend
  template:
    metadata:
      labels:
        app: deploy-frontend
    spec:
      containers:
        - name: deploy-frontend
          image: opsplatform-deploy-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: deploy-frontend
  namespace: deploy-ops
spec:
  type: NodePort
  selector:
    app: deploy-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30826
