apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsplatform-gke-version-frontend
  namespace: opsplatform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opsplatform-gke-version-frontend
  template:
    metadata:
      labels:
        app: opsplatform-gke-version-frontend
    spec:
      containers:
      - name: frontend
        image: localhost:8070/opsplatform/opsplatform-gke-version-frontend:v9
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
      volumes:
      - name: nginx-conf
        configMap:
          name: gke-version-exporter-frontend-nginx
          items:
          - key: default.conf
            path: default.conf
---
apiVersion: v1
kind: Service
metadata:
  name: opsplatform-gke-version-frontend
  namespace: opsplatform
spec:
  type: NodePort
  selector:
    app: opsplatform-gke-version-frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30827
