apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsplatform-gke-version-frontend
  namespace: opsplatform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opsplatform-gke-version-frontend
  template:
    metadata:
      labels:
        app: opsplatform-gke-version-frontend
    spec:
      containers:
      - name: frontend
        image: localhost:8070/opsplatform/opsplatform-gke-version-frontend:v4
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: opsplatform-gke-version-frontend
  namespace: opsplatform
spec:
  type: NodePort
  selector:
    app: opsplatform-gke-version-frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30827
