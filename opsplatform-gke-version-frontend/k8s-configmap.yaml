# 前端 nginx 反代配置
# 挂载到 pod 的 /etc/nginx/conf.d/default.conf
# 改 nginx 配置不用重新 build 镜像，只要：
#   1. 修改本文件 → kubectl apply
#   2. 滚动重启前端：kubectl -n opsplatform rollout restart deployment/opsplatform-gke-version-frontend
apiVersion: v1
kind: ConfigMap
metadata:
  name: gke-version-exporter-frontend-nginx
  namespace: opsplatform
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://opsplatform-gke-version-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
