apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsplatform-domain-frontend
  namespace: domain-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opsplatform-domain-frontend
  template:
    metadata:
      labels:
        app: opsplatform-domain-frontend
    spec:
      containers:
        - name: opsplatform-domain-frontend
          image: localhost:8070/opsplatform/opsplatform-domain-frontend:v14
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: opsplatform-domain-frontend
  namespace: domain-platform
spec:
  type: NodePort
  selector:
    app: opsplatform-domain-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30840
