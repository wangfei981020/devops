apiVersion: v1
kind: ConfigMap
metadata:
  name: opsplatform-ai-frontend-nginx
  namespace: opsplatform
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      # 对话 SSE：关缓冲、长超时
      location = /api/chat {
        proxy_pass http://opsplatform-ai-backend:8080;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding off;
      }
      location /api/ {
        proxy_pass http://opsplatform-ai-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
      }
      location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
      location = /index.html { add_header Cache-Control "no-store, no-cache, must-revalidate"; }
      location / { try_files $uri $uri/ /index.html; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsplatform-ai-frontend
  namespace: opsplatform
spec:
  replicas: 1
  selector:
    matchLabels: { app: opsplatform-ai-frontend }
  template:
    metadata:
      labels: { app: opsplatform-ai-frontend }
    spec:
      containers:
        - name: frontend
          image: localhost:8070/opsplatform/opsplatform-ai-frontend:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: nginx-conf
          configMap: { name: opsplatform-ai-frontend-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: opsplatform-ai-frontend
  namespace: opsplatform
spec:
  type: NodePort
  selector: { app: opsplatform-ai-frontend }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30830
